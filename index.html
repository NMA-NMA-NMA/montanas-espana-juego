<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montañas de España - Juego Educativo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🏔️ Identificar Montañas de España</h1>
        <p class="instrucciones">Haz clic en el nombre de una montaña y luego en su ubicación correcta en el mapa</p>
        
        <div class="juego-container">
            <div class="mapa-section">
                <div class="mapa-wrapper">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1e/Spain_topography_map_en.png/1200px-Spain_topography_map_en.png" alt="Mapa de España" class="mapa">
                    <div class="zona" data-montana="Macizo Galaico" style="top: 15%; left: 8%;"></div>
                    <div class="zona" data-montana="Montes de León" style="top: 12%; left: 18%;"></div>
                    <div class="zona" data-montana="Cordillera Cantábrica" style="top: 10%; left: 28%;"></div>
                    <div class="zona" data-montana="Pirineos" style="top: 5%; left: 50%;"></div>
                    <div class="zona" data-montana="Montes Vascos" style="top: 15%; left: 38%;"></div>
                    <div class="zona" data-montana="Depresión del Ebro" style="top: 25%; left: 55%;"></div>
                    <div class="zona" data-montana="Sistema Ibérico" style="top: 30%; left: 60%;"></div>
                    <div class="zona" data-montana="Submeseta Norte" style="top: 28%; left: 40%;"></div>
                    <div class="zona" data-montana="Cordillera del Guadarrama" style="top: 35%; left: 45%;"></div>
                    <div class="zona" data-montana="Sistema Central" style="top: 38%; left: 40%;"></div>
                    <div class="zona" data-montana="Montes de Toledo" style="top: 48%; left: 38%;"></div>
                    <div class="zona" data-montana="Submeseta Sur" style="top: 50%; left: 50%;"></div>
                    <div class="zona" data-montana="Sierra Morena" style="top: 58%; left: 35%;"></div>
                    <div class="zona" data-montana="Depresión del Guadalquivir" style="top: 62%; left: 38%;"></div>
                    <div class="zona" data-montana="Montes de Córdoba" style="top: 60%; left: 45%;"></div>
                    <div class="zona" data-montana="Cordillera Penibética" style="top: 72%; left: 58%;"></div>
                    <div class="zona" data-montana="Telde" style="top: 88%; left: 5%;"></div>
                </div>
            </div>
            
            <div class="nombres-section">
                <h3>Selecciona y localiza:</h3>
                <div class="nombres-container" id="nombresContainer">
                    <!-- Se genera con JavaScript -->
                </div>
            </div>
        </div>
        
        <div class="info-game">
            <p>Puntuación: <span id="puntuacion">0</span> / 17</p>
            <button id="reiniciar" class="btn-reiniciar">🔄 Reiniciar Juego</button>
        </div>
        
        <div id="mensaje" class="mensaje"></div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
