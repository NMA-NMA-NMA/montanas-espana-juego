<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montañas de España - Juego Educativo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🏔️ Identificar Montañas de España</h1>
        <p class="instrucciones">Haz clic en el nombre de una montaña y luego en su ubicación correcta en el mapa</p>
        
        <div class="juego-container">
            <div class="mapa-section">
                <div class="mapa-wrapper">
                    <img src="mapa-espana.svg" alt="Mapa de España" class="mapa" id="mapaImg">
                    <div class="zona" data-montana="Macizo Galaico" style="top: 12%; left: 12%;">1</div>
                    <div class="zona" data-montana="Montes de León" style="top: 15%; left: 22%;">2</div>
                    <div class="zona" data-montana="Cordillera Cantábrica" style="top: 18%; left: 30%;">3</div>
                    <div class="zona" data-montana="Montes Vascos" style="top: 22%; left: 40%;">11</div>
                    <div class="zona" data-montana="Pirineos" style="top: 8%; left: 45%;">10</div>
                    <div class="zona" data-montana="Depresión del Ebro" style="top: 28%; left: 55%;">7</div>
                    <div class="zona" data-montana="Sistema Ibérico" style="top: 32%; left: 62%;">8</div>
                    <div class="zona" data-montana="Submeseta Norte" style="top: 30%; left: 42%;">9</div>
                    <div class="zona" data-montana="Cordillera del Guadarrama" style="top: 37%; left: 48%;">6</div>
                    <div class="zona" data-montana="Sistema Central" style="top: 40%; left: 42%;">5</div>
                    <div class="zona" data-montana="Montes de Toledo" style="top: 48%; left: 40%;">4</div>
                    <div class="zona" data-montana="Submeseta Sur" style="top: 50%; left: 52%;">12</div>
                    <div class="zona" data-montana="Sierra Morena" style="top: 58%; left: 38%;">13</div>
                    <div class="zona" data-montana="Depresión del Guadalquivir" style="top: 62%; left: 42%;">14</div>
                    <div class="zona" data-montana="Montes de Córdoba" style="top: 60%; left: 48%;">15</div>
                    <div class="zona" data-montana="Cordillera Penibética" style="top: 71%; left: 62%;">16</div>
                    <div class="zona" data-montana="Telde" style="top: 78%; left: 15%;">17</div>
                </div>
            </div>
            
            <div class="nombres-section">
                <h3>📍 Selecciona y localiza:</h3>
                <div class="nombres-container" id="nombresContainer">
                    <!-- Se genera con JavaScript -->
                </div>
            </div>
        </div>
        
        <div class="info-game">
            <p>⭐ Puntuación: <span id="puntuacion">0</span> / 17</p>
            <button id="reiniciar" class="btn-reiniciar">🔄 Reiniciar Juego</button>
        </div>
        
        <div id="mensaje" class="mensaje"></div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
