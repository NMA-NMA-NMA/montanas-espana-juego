<svg viewBox="0 0 960 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B3D9FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6DB3FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="spainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE5B4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F5DEB3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DEB887;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Océano -->
  <rect width="960" height="1200" fill="url(#oceanGrad)"/>
  
  <!-- Península Ibérica con contorno realista -->
  <path d="M 280 200 L 320 180 L 360 170 L 400 165 L 440 160 L 480 165 L 520 175 L 560 190 L 600 210 L 630 240 L 650 270 L 665 300 L 675 330 L 680 360 L 682 390 L 680 420 L 675 450 L 668 480 L 660 500 L 650 515 L 638 525 L 625 532 L 610 535 L 595 537 L 580 538 L 565 537 L 550 535 L 535 534 L 520 533 L 505 532 L 490 531 L 475 530 L 460 530 L 445 531 L 430 532 L 415 533 L 400 533 L 385 532 L 370 530 L 355 528 L 340 525 L 325 520 L 310 512 L 295 500 L 280 485 L 268 465 L 258 440 L 252 410 L 250 380 L 252 350 L 258 320 L 268 290 L 280 260 L 292 230 L 298 210 Z" fill="url(#spainGrad)" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Detalles costeros norte -->
  <path d="M 280 200 Q 275 220 280 240" stroke="#333" stroke-width="1" fill="none" opacity="0.3"/>
  <path d="M 320 180 Q 315 200 325 220" stroke="#333" stroke-width="1" fill="none" opacity="0.3"/>
  
  <!-- Detalles costeros este -->
  <path d="M 680 360 Q 695 380 690 410" stroke="#333" stroke-width="1" fill="none" opacity="0.3"/>
  <path d="M 675 330 Q 690 340 685 360" stroke="#333" stroke-width="1" fill="none" opacity="0.3"/>
  
  <!-- Detalles costeros sur -->
  <path d="M 625 532 Q 640 535 655 530" stroke="#333" stroke-width="1" fill="none" opacity="0.3"/>
  
  <!-- Detalles costeros oeste -->
  <path d="M 250 380 Q 240 400 245 430" stroke="#333" stroke-width="1" fill="none" opacity="0.3"/>
  
  <!-- ISLAS BALEARES -->
  <g id="baleares">
    <!-- Mallorca -->
    <ellipse cx="720" cy="320" rx="12" ry="16" fill="url(#spainGrad)" stroke="#333" stroke-width="1.5"/>
    <!-- Menorca -->
    <ellipse cx="755" cy="295" rx="9" ry="11" fill="url(#spainGrad)" stroke="#333" stroke-width="1.5"/>
    <!-- Ibiza -->
    <ellipse cx="705" cy="360" rx="7" ry="10" fill="url(#spainGrad)" stroke="#333" stroke-width="1.5"/>
    <!-- Formentera -->
    <circle cx="690" cy="375" r="4" fill="url(#spainGrad)" stroke="#333" stroke-width="1"/>
  </g>
  
  <!-- ISLAS CANARIAS (parte inferior) -->
  <g id="canarias">
    <!-- Tenerife (la más grande) -->
    <ellipse cx="180" cy="950" rx="18" ry="22" fill="url(#spainGrad)" stroke="#333" stroke-width="2"/>
    <!-- Gran Canaria -->
    <ellipse cx="240" cy="980" rx="14" ry="16" fill="url(#spainGrad)" stroke="#333" stroke-width="2"/>
    <!-- La Palma -->
    <ellipse cx="150" cy="1020" rx="10" ry="12" fill="url(#spainGrad)" stroke="#333" stroke-width="1.5"/>
    <!-- Fuerteventura -->
    <ellipse cx="290" cy="1030" rx="12" ry="14" fill="url(#spainGrad)" stroke="#333" stroke-width="1.5"/>
    <!-- Lanzarote -->
    <ellipse cx="330" cy="1010" rx="10" ry="11" fill="url(#spainGrad)" stroke="#333" stroke-width="1.5"/>
    <!-- El Hierro -->
    <circle cx="120" cy="1060" r="5" fill="url(#spainGrad)" stroke="#333" stroke-width="1"/>
    <!-- La Gomera -->
    <circle cx="135" cy="1040" r="6" fill="url(#spainGrad)" stroke="#333" stroke-width="1.5"/>
  </g>
  
  <!-- RELIEVE - Líneas de monta ñas -->
  <g id="relieve" stroke="#A0522D" stroke-width="1.8" fill="none" opacity="0.35" stroke-linecap="round">
    <!-- Pirineos (norte) -->
    <path d="M 400 165 Q 440 158 480 165"/>
    <path d="M 410 175 Q 450 168 490 178"/>
    <path d="M 420 185 Q 460 178 500 188"/>
    
    <!-- Cordillera Cantábrica (noroeste) -->
    <path d="M 280 200 Q 310 195 340 210"/>
    <path d="M 290 215 Q 320 210 350 225"/>
    <path d="M 300 230 Q 330 225 360 240"/>
    
    <!-- Sistema Central -->
    <path d="M 420 360 Q 460 350 490 365"/>
    <path d="M 410 380 Q 450 370 480 385"/>
    
    <!-- Sistema Ibérico (este) -->
    <path d="M 550 300 Q 600 290 630 315"/>
    <path d="M 540 330 Q 590 320 620 345"/>
    
    <!-- Sierra Morena (sur) -->
    <path d="M 320 480 Q 370 470 410 490"/>
    <path d="M 310 500 Q 360 490 400 510"/>
    
    <!-- Cordillera Penibética (sureste) -->
    <path d="M 590 510 Q 630 500 660 520"/>
    <path d="M 580 530 Q 620 520 650 540"/>
  </g>
  
  <!-- TÍTULOS -->
  <text x="480" y="50" font-size="36" font-weight="bold" text-anchor="middle" fill="#222">ESPAÑA - ZONAS MONTAÑOSAS</text>
  <text x="480" y="80" font-size="14" text-anchor="middle" fill="#555">Identifica cada región geográfica en el mapa</text>
  
  <!-- Leyenda simple -->
  <g opacity="0.6">
    <text x="750" y="1120" font-size="12" fill="#333">🏔️ Mapa realista con 17 zonas</text>
    <text x="750" y="1140" font-size="12" fill="#333">🏝️ Incluye Canarias y Baleares</text>
  </g>
</svg>