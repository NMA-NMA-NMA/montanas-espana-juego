<svg viewBox="0 0 1000 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E0F6FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#87CEEB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="spainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5DEB3;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#DEB887;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CD853F;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Océano -->
  <rect width="1000" height="1200" fill="url(#oceanGrad)"/>
  
  <!-- ESPAÑA - Silueta realista -->
  <g id="spain">
    <!-- Territorio principal -->
    <path d="M 200 180 L 250 160 L 300 150 L 350 145 L 400 140 L 450 145 L 500 150 L 550 160 L 600 170 L 650 185 L 700 200 L 740 220 L 760 240 L 780 270 L 790 300 L 800 340 L 805 380 L 805 420 L 800 460 L 790 500 L 775 530 L 755 550 L 730 565 L 700 575 L 660 580 L 620 582 L 580 583 L 540 582 L 500 580 L 460 581 L 420 583 L 380 582 L 340 580 L 300 575 L 260 570 L 220 560 L 180 545 L 150 520 L 130 490 L 115 450 L 105 400 L 100 350 L 100 300 L 105 250 L 115 210 L 135 185 L 165 170 Z" fill="url(#spainGrad)" stroke="#333" stroke-width="2"/>
    
    <!-- Península Ibérica - detalles costeros -->
    <path d="M 200 180 L 190 200 L 185 230 L 185 260 L 190 290 L 200 310 L 210 330 L 215 350" stroke="#333" stroke-width="1" fill="none" opacity="0.3"/>
    
    <!-- Baleares -->
    <circle cx="780" cy="350" r="8" fill="url(#spainGrad)" stroke="#333" stroke-width="1.5"/>
    <circle cx="800" cy="340" r="6" fill="url(#spainGrad)" stroke="#333" stroke-width="1.5"/>
    <circle cx="790" cy="365" r="5" fill="url(#spainGrad)" stroke="#333" stroke-width="1.5"/>
  </g>
  
  <!-- CANARIAS (abajo) -->
  <g id="canarias">
    <circle cx="150" cy="950" r="12" fill="url(#spainGrad)" stroke="#333" stroke-width="2"/>
    <circle cx="190" cy="990" r="10" fill="url(#spainGrad)" stroke="#333" stroke-width="2"/>
    <circle cx="220" cy="960" r="9" fill="url(#spainGrad)" stroke="#333" stroke-width="2"/>
    <circle cx="170" cy="1030" r="8" fill="url(#spainGrad)" stroke="#333" stroke-width="2"/>
  </g>
  
  <!-- MONTAÑAS - Líneas de relieve -->
  <g id="relieve" opacity="0.4" stroke="#8B4513" stroke-width="2" fill="none">
    <!-- Pirineos (norte) -->
    <path d="M 350 140 Q 400 130 450 140"/>
    <path d="M 370 155 Q 410 145 450 155"/>
    
    <!-- Cordillera Cantábrica (noroeste) -->
    <path d="M 220 170 Q 250 160 300 175"/>
    <path d="M 210 190 Q 240 180 280 195"/>
    
    <!-- Sistema Central -->
    <path d="M 380 380 Q 420 370 460 380"/>
    <path d="M 370 400 Q 410 390 450 400"/>
    
    <!-- Sistema Ibérico (este) -->
    <path d="M 550 320 Q 590 310 620 330"/>
    <path d="M 540 350 Q 580 340 610 360"/>
    
    <!-- Sierra Morena (sur-centro) -->
    <path d="M 280 500 Q 320 490 360 510"/>
    <path d="M 270 520 Q 310 510 350 530"/>
    
    <!-- Cordillera Penibética (sur) -->
    <path d="M 600 540 Q 640 530 680 550"/>
    <path d="M 590 560 Q 630 550 670 570"/>
  </g>
  
  <!-- ETIQUETAS de orientación -->
  <text x="500" y="50" font-size="32" font-weight="bold" text-anchor="middle" fill="#333">ESPAÑA - ZONAS MONTAÑOSAS</text>
  <text x="500" y="80" font-size="14" text-anchor="middle" fill="#666">Haz clic en cada montaña del mapa</text>
</svg>